[project]
name = "genetic-algorithm-keras"
version = "0.1.0"
description = "Genetic algorithm that evolves Keras CNN architectures"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.20,<2.22",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
